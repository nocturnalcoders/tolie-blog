name: tolie-blog

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: blog
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run deploy/setup.sh first}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog -d blog"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://blog:${POSTGRES_PASSWORD}@db:5432/blog
      BLOG_SECRET_KEY: ${BLOG_SECRET_KEY:?Run deploy/setup.sh first}
      BLOG_ADMIN_USER: ${BLOG_ADMIN_USER:-admin}
      BLOG_ADMIN_HASH_B64: ${BLOG_ADMIN_HASH_B64:-pending}
      BLOG_SITE_URL: ${BLOG_SITE_URL:-https://blog.tolie.space}
      BLOG_SHELL_URL: http://web/index.html
      # Optional: where to send "new comment" notifications (see .env.example)
      BLOG_TELEGRAM_TOKEN: ${BLOG_TELEGRAM_TOKEN:-}
      BLOG_TELEGRAM_CHAT_ID: ${BLOG_TELEGRAM_CHAT_ID:-}
      BLOG_SMTP_HOST: ${BLOG_SMTP_HOST:-}
      BLOG_SMTP_PORT: ${BLOG_SMTP_PORT:-587}
      BLOG_SMTP_USER: ${BLOG_SMTP_USER:-}
      BLOG_SMTP_PASSWORD: ${BLOG_SMTP_PASSWORD:-}
      BLOG_NOTIFY_EMAIL: ${BLOG_NOTIFY_EMAIL:-}
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    # Only reachable from the droplet itself. Caddy forwards the public domain here.
    ports:
      - "127.0.0.1:8788:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  uploads:
